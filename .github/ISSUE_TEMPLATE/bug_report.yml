name: Bug report
description: Something is broken in a component, the docs site, or the registry.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Check existing issues first, and skim [ARCHITECTURE.md](../ARCHITECTURE.md) if the bug involves where code belongs.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the bug show up?
      options:
        - Component / composite (`components/ui` + registry)
        - Shared site UI (`components/shared`)
        - Docs site
        - Registry / tooling
        - Other
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component or package
      description: e.g. `@nk/button`, docs preview, `pnpm registry:build`
      placeholder: "@nk/…"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect instead?
      placeholder: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a small repro help a lot.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node/pnpm versions, and how you installed the component (CLI vs local).
      value: |
        - OS:
        - Browser:
        - Node:
        - pnpm:
        - Install path: (e.g. `npx shadcn add @nk/…` / this repo)
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, console errors, RTL notes, or related PRs.
    validations:
      required: false
